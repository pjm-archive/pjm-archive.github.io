<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>박정민 스케줄 아카이브</title>
<meta name="description" content="박정민 배우 온·오프라인 일정과 행사별 착용 아이템 아카이브">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: single mobile column, fixed top tab bar, hairline-ruled calendar grid, bottom-sheet popup with 1-depth navigation */
:root{
  --bg:#ffffff; --fg:#111111; --muted:#777a7d; --line:#d9dadb; --line-strong:#111111; --soft:#f4f4f5;
  --c-gv:#2f5d8a; --c-muin:#8a3b3b; --c-book:#3f6b45; --c-tv:#7a5a1f;
  --scrim:rgba(0,0,0,.35);
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0e0f; --fg:#f2f2f2; --muted:#8d9094; --line:#2c2d2f; --line-strong:#f2f2f2; --soft:#18191a;
  --c-gv:#7fa9d4; --c-muin:#d68a8a; --c-book:#8fbf95; --c-tv:#d3b06c; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0e0f; --fg:#f2f2f2; --muted:#8d9094; --line:#2c2d2f; --line-strong:#f2f2f2; --soft:#18191a;
  --c-gv:#7fa9d4; --c-muin:#d68a8a; --c-book:#8fbf95; --c-tv:#d3b06c; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line-strong)}
.brand{display:flex;justify-content:space-between;align-items:baseline;padding-block:14px 6px}
.brand h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;gap:24px}
nav button{padding-block:8px 10px;font-size:14px;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--fg);font-weight:500;border-bottom-color:var(--fg)}

main{padding-block:20px 48px}
.sample{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em;border:1px solid var(--line);padding:3px 8px;display:inline-block;margin-bottom:16px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head h2{margin:0;font-family:var(--mono);font-weight:400;font-size:20px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.cal-head .arrows{display:flex;gap:4px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line)}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.2}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow div{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;padding-block:6px;letter-spacing:.05em}
.dow div:first-child{color:var(--c-muin)}
.grid{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:76px;padding:5px 3px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.day.out{background:var(--soft)}
.day .n{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;width:20px;height:20px;line-height:20px}
.day.today .n{background:var(--fg);color:var(--bg);border-radius:50%}
.day.has{cursor:pointer}
.day.has:hover{background:var(--soft)}
.marks{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%}
.chip{display:inline-block;font-size:9.5px;line-height:1;padding:3px 4px;border:1px solid currentColor;border-radius:2px;white-space:nowrap;font-weight:500;letter-spacing:-.02em}
.chip.etc{color:var(--muted)} .chip.gv{color:var(--c-gv)} .chip.muin{color:var(--c-muin)} .chip.book{color:var(--c-book)} .chip.tv{color:var(--c-tv)}
.app{width:18px;height:18px;display:block}
.more{font-family:var(--mono);font-size:9px;color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:16px;align-items:center;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* items list */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-strong)}
.list li{border-bottom:1px solid var(--line)}
.list button{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding-block:14px}
.thumb{width:64px;aspect-ratio:1;max-width:100%;border:1px solid var(--line);display:block}
.list .meta{min-width:0}
.list .date{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.list .ttl{font-size:14.5px;font-weight:500;margin-top:3px;text-wrap:balance}
.list .cnt{font-size:11.5px;color:var(--muted);margin-top:2px}
.list .go{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:1.2}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-top:1px solid var(--line-strong);max-height:86vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet-in{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1}
.sheet-bar{display:flex;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-bar .t{flex:1;min-width:0;font-family:var(--mono);font-size:12px;letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-bar .icon-btn{border:0;width:32px;height:32px}
.sheet-bar .icon-btn svg{width:16px;height:16px}
.sheet-body{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}

.ev{padding-block:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.ev:last-child{border-bottom:0}
.ev .type{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.ev h3{margin:0;font-size:16px;font-weight:500;line-height:1.4;text-wrap:balance}
.ev h3 button{text-align:left;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;display:inline-flex;align-items:center;gap:4px}
.ev h3 button svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.3;flex:none}
.ev dl{margin:0;display:grid;grid-template-columns:36px 1fr;gap:4px 8px;font-size:13px}
.ev dt{color:var(--muted);font-size:11px;padding-top:2px}
.ev dd{margin:0;min-width:0}

.item-head{padding-block:16px 4px}
.item-head .type{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.item-head h3{margin:6px 0 0;font-size:17px;font-weight:500;text-wrap:balance}
.srcs{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.src{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:10px 12px;color:var(--fg);text-decoration:none;font-size:13px}
.src:hover{border-color:var(--fg)}
.src .who{flex:1;min-width:0;display:flex;flex-direction:column}
.src .who b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .who small{font-size:11px;color:var(--muted)}
.src svg.ext{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.3;flex:none}
.item{padding-block:18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.item:last-child{border-bottom:0}
.photo{width:100%;max-width:100%;aspect-ratio:4/5;border:1px solid var(--line);display:block}
.item .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cat{font-family:var(--mono);font-size:10px;letter-spacing:.08em;border:1px solid var(--fg);padding:2px 7px}
.idx{font-family:var(--mono);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .name{font-size:14.5px;font-weight:500;margin:0}
.item .brandname{font-size:12px;color:var(--muted);margin:0}
.buy{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line-strong);padding:10px 12px;font-size:13px;color:var(--fg);text-decoration:none}
.buy svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.3}
.buy:hover{background:var(--fg);color:var(--bg)}
.status{font-size:12px;color:var(--muted);margin-bottom:12px}
.status:empty{display:none}
.embed{margin-top:14px;min-height:40px}
.embed iframe{width:100%;max-width:100%;aspect-ratio:16/9;border:0;display:block}
.brands{display:flex;gap:6px;overflow-x:auto;padding-bottom:14px;margin-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.brands::-webkit-scrollbar{display:none}
.bf{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:6px 11px;font-size:12.5px;white-space:nowrap;color:var(--muted)}
.bf span{font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums}
.bf[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.empty{color:var(--muted);font-size:13px;padding-block:20px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><h1>박정민 스케줄 아카이브</h1><span>Fan archive</span></div>
    <nav role="tablist">
      <button role="tab" id="tab-cal" aria-selected="true" data-view="cal">일정</button>
      <button role="tab" id="tab-items" aria-selected="false" data-view="items">아이템정보</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="status" id="status">불러오는 중…</div>

  <section id="view-cal">
    <div class="cal-head">
      <h2 id="monthLabel"></h2>
      <div class="arrows">
        <button class="icon-btn" id="prev" aria-label="이전 달"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
        <button class="icon-btn" id="next" aria-label="다음 달"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
      </div>
    </div>
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid" id="grid"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section id="view-items" hidden>
    <div class="brands" id="brandBar" role="group" aria-label="브랜드로 보기" hidden></div>
    <ul class="list" id="itemList"></ul>
  </section>
</main>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-in">
    <div class="sheet-bar">
      <button class="icon-btn" id="back" aria-label="뒤로" hidden><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
      <div class="t" id="sheetTitle"></div>
      <button class="icon-btn" id="close" aria-label="닫기"><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<script src="app.js?v=20261119b"></script>
</body>
</html>
