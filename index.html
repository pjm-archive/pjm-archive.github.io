<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>박정민 스케줄 아카이브</title>
<meta name="description" content="박정민 배우 온·오프라인 일정과 행사별 착용 아이템 아카이브">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: C안 룩북/행택 — 원단 견본 같은 흰 칸 + 검은 실선 달력, 케어 라벨 상세, 행택 카드 아이템 그리드 */
:root{
  --bg:#efeeea; --paper:#ffffff; --fg:#111111; --muted:#6d6e70; --line:#111111; --hair:#c9c8c3; --out:#e4e3de;
  --scrim:rgba(0,0,0,.35);
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141413; --paper:#1c1c1b; --fg:#ecebe6; --muted:#9a9a96; --line:#ecebe6; --hair:#3a3a37; --out:#181817; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --paper:#1c1c1b; --fg:#ecebe6; --muted:#9a9a96; --line:#ecebe6; --hair:#3a3a37; --out:#181817; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono)}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.15;stroke-linejoin:round;stroke-linecap:round;flex:none;display:block}
.chip{display:inline-block;font-size:9px;line-height:13px;padding:0 3px;border:1px solid currentColor;white-space:nowrap;font-weight:500}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:16px 12px}
.brand{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.brand h1{margin:0;font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.16em}
.brand span{font-size:11px;color:var(--muted)}
nav{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
nav button{font-family:var(--mono);font-size:11px;letter-spacing:.16em;padding:8px 0}
nav button[aria-selected="true"]{background:var(--fg);color:var(--bg)}

main{padding-block:8px 28px}
.status{font-size:12px;color:var(--muted);margin-bottom:12px}
.status:empty{display:none}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head h2{margin:0;font-family:var(--mono);font-weight:500;font-size:24px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.cal-head .arrows{display:flex;align-items:center;gap:6px}
.cal-head .cnt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);margin-right:4px}
.sq{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line)}
.sq svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.2}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow div{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted);text-align:center;padding-block:5px}
.grid{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:66px;padding:4px;background:var(--paper);display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0;overflow:hidden}
.day.out{background:var(--out);color:var(--muted)}
.day .n{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums}
.day.today .n > span:first-child{background:var(--fg);color:var(--paper);padding:0 3px}
.day .n em{font-style:normal;font-size:8.5px;line-height:13px;background:var(--fg);color:var(--paper);padding:0 4px}
.day.has{cursor:pointer}
.day.has:hover{outline:2px solid var(--fg);outline-offset:-2px}
.marks{display:flex;flex-wrap:wrap;align-items:center;gap:3px 4px}
.marks .g{display:inline-flex;align-items:center;gap:1px}
.marks .x,.marks .more{font-family:var(--mono);font-size:8.5px}
.marks .more{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;align-items:center;font-size:10.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend .ic{width:13px;height:13px;color:var(--fg)}
.legend .chip{color:var(--fg)}
.legend em{font-style:normal;font-family:var(--mono);font-size:8.5px;background:var(--fg);color:var(--paper);padding:0 4px}

/* wardrobe tools */
.tools{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.tool{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);padding:7px 10px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.tool svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.2}
.tool .caret{width:11px;height:11px;transition:transform .15s}
.tool[aria-expanded="true"] .caret{transform:rotate(180deg)}
.tool.on{background:var(--fg);color:var(--paper)}
.period{border:1px solid var(--line);background:var(--paper);padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:12px}
.period .quick{display:flex;flex-wrap:wrap;gap:6px}
.period .quick button{border:1px solid var(--line);padding:4px 9px;font-size:11.5px}
.period .quick button[aria-pressed="true"]{background:var(--fg);color:var(--paper)}
.period .range{display:grid;grid-template-columns:auto 1fr auto auto 1fr;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.period select{min-width:0;width:100%;font-family:var(--mono);font-size:12px;color:var(--fg);background:var(--paper);border:1px solid var(--line);border-radius:0;padding:6px}
.codes,.brands{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.codes::-webkit-scrollbar,.brands::-webkit-scrollbar{display:none}
.codes button,.bf{flex:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);padding:4px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;white-space:nowrap}
.bf{letter-spacing:.08em;text-transform:uppercase}
.bf span,.codes span{font-size:9px;opacity:.6;letter-spacing:0}
.codes button[aria-pressed="true"],.bf[aria-pressed="true"]{background:var(--fg);color:var(--paper)}

/* wardrobe list */
.list{list-style:none;margin:6px 0 0;padding:0}
.list .mhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,96px));z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:baseline;padding-block:12px 6px;border-bottom:1px solid var(--line);margin-bottom:10px}
.list .mhead span{font-family:var(--mono);font-size:15px;font-weight:500;letter-spacing:.04em}
.list .mhead small{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--muted)}
.list .tags{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tag{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--paper);border:1px solid var(--line);padding:20px 10px 10px;clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%,0 14px);min-width:0;width:100%}
.tag::before{content:"";position:absolute;top:7px;left:50%;width:7px;height:7px;margin-left:-3.5px;border:1px solid var(--line);border-radius:50%}
.tag .no{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--muted)}
.tag .br{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.12em;margin-top:6px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag .nm{font-size:12px;line-height:1.38;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:33px}
.tag .ev{font-family:var(--mono);font-size:8.5px;color:var(--muted);letter-spacing:.04em;margin-top:8px;border-top:1px dashed var(--hair);padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag .bc{height:18px;margin-top:8px;background:repeating-linear-gradient(90deg,var(--fg) 0 1px,transparent 1px 3px,var(--fg) 3px 5px,transparent 5px 6px,var(--fg) 6px 7px,transparent 7px 10px)}
.tag .ft{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:.12em;margin-top:7px}
button.tag:hover{outline:2px solid var(--fg);outline-offset:-3px}
.empty{color:var(--muted);font-size:13px;padding-block:20px;list-style:none}
.reset{margin-left:6px;text-decoration:underline;text-underline-offset:3px;color:var(--fg);font-size:13px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-top:1px solid var(--line);max-height:88vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet-in{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1}
.sheet-bar{display:flex;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-bar .nav{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:2px}
.sheet-bar .t{min-width:0;display:flex;flex-direction:column;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet-bar .t small{font-size:9px;color:var(--muted);letter-spacing:.12em;min-height:12px}
.icon-btn{width:32px;height:32px;display:grid;place-items:center}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.2}
.icon-btn:disabled{opacity:.2;cursor:default}
.back-btn{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;width:64px;height:32px}
.back-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.2;flex:none}
#close{margin-left:32px}
.sheet-body{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.sheet-body.in-r{animation:inR .22s ease}
.sheet-body.in-l{animation:inL .22s ease}
@keyframes inR{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}.sheet-body.in-r,.sheet-body.in-l{animation:none}}

/* care label (날짜 상세) */
.care{background:var(--paper);border:1px solid var(--line);outline:1px dashed var(--hair);outline-offset:-6px;padding:14px 16px}
.care .top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.14em;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px}
.care .r{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:12px 0}
.care .r + .r{border-top:1px dashed var(--hair)}
.care .r > .ic,.care .r > .chip{margin-top:2px}
.care .r > .chip{justify-self:start;font-size:8px;padding:0 2px}
.care h3{margin:0;font-size:14.5px;font-weight:500;line-height:1.45;text-wrap:balance}
.care .meta{margin:4px 0 0;display:grid;grid-template-columns:32px 1fr;gap:2px 6px;font-size:12px}
.care .meta dt{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--muted);padding-top:2px}
.care .meta dd{margin:0;min-width:0}
.care .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pcs{display:inline-flex;align-items:center;gap:6px;background:var(--fg);color:var(--paper);font-family:var(--mono);font-size:10px;letter-spacing:.12em;padding:5px 9px}
.orig{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);color:var(--fg);text-decoration:none;font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:4px 8px}
.orig .ic{width:13px;height:13px}
.orig:hover{background:var(--fg);color:var(--paper)}

/* items sheet */
.item-head{margin-bottom:14px}
.item-head .type{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--muted)}
.item-head h3{margin:6px 0 0;font-size:16px;font-weight:500;line-height:1.45;text-wrap:balance}
.embed{margin-top:12px}
.embed iframe{width:100%;max-width:100%;aspect-ratio:16/9;border:0;display:block}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sheet-tags{display:flex;flex-direction:column;gap:12px}
.sheet-tags .tag{padding:22px 14px 12px}
.sheet-tags .tag .nm{font-size:13.5px;min-height:0;-webkit-line-clamp:3}
.sheet-tags .tag .bc{height:20px}
.buy{display:flex;justify-content:space-between;align-items:center;margin-top:10px;border:1px solid var(--line);padding:8px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--fg);text-decoration:none}
.buy:hover{background:var(--fg);color:var(--paper)}
.buy.none{border-style:dashed;color:var(--muted)}
.tag.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{outline:2px solid var(--fg);outline-offset:-3px}100%{outline-color:transparent}}

/* footer */
.site-foot{border-top:1px solid var(--line);padding-block:16px 32px;display:flex;flex-direction:column;gap:4px}
.site-foot p{margin:0}
.site-foot .credit{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted)}
.site-foot .credit a{color:var(--fg);text-decoration:none;font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:0;display:inline-flex;align-items:center;gap:3px;margin-left:4px;border-bottom:1px solid var(--hair)}
.site-foot .credit a:hover{border-bottom-color:var(--fg)}
.site-foot .credit svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:1.3}
.site-foot .note{font-size:10.5px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-youtube" viewBox="0 0 16 16"><rect x="1.5" y="3.5" width="13" height="9" rx="2.5"/><path d="M6.6 6.2v3.6L9.8 8z"/></symbol>
  <symbol id="i-instagram" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="3.5"/><circle cx="8" cy="8" r="2.7"/><circle cx="11.4" cy="4.6" r=".4"/></symbol>
  <symbol id="i-cafe" viewBox="0 0 16 16"><path d="M3 5.5h8v3.8A3.2 3.2 0 0 1 7.8 12.5H6.2A3.2 3.2 0 0 1 3 9.3z"/><path d="M11 6.5h.8a1.6 1.6 0 0 1 0 3.2H11"/><path d="M5.5 2.5v1.3M8.5 2.5v1.3"/></symbol>
  <symbol id="i-blog" viewBox="0 0 16 16"><path d="M3 2.5h7.5L13 5v8.5H3z"/><path d="M10.5 2.5V5H13M5.5 8h5M5.5 10.5h3.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M3 3h3l7 10h-3zM12.5 3 3.5 13"/></symbol>
</svg>

<header>
  <div class="wrap">
    <div class="brand"><h1>PJM ARCHIVE</h1><span>박정민 스케줄 아카이브</span></div>
    <nav role="tablist">
      <button role="tab" id="tab-cal" aria-selected="true" data-view="cal">SCHEDULE</button>
      <button role="tab" id="tab-items" aria-selected="false" data-view="items">WARDROBE</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="status" id="status">불러오는 중…</div>

  <section id="view-cal" aria-label="일정">
    <div class="cal-head">
      <h2 id="monthLabel"></h2>
      <div class="arrows">
        <span class="cnt" id="monthCnt"></span>
        <button class="sq" id="prev" aria-label="이전 달"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
        <button class="sq" id="next" aria-label="다음 달"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
      </div>
    </div>
    <div class="dow"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div></div>
    <div class="grid" id="grid"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section id="view-items" aria-label="아이템" hidden>
    <div class="tools">
      <button class="tool" id="periodBtn" aria-expanded="false" aria-controls="periodPanel"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="10"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/></svg><span id="periodLabel">전체 기간</span><svg class="caret" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
      <button class="tool" id="sortBtn" aria-label="정렬 순서 바꾸기">최신순</button>
    </div>
    <div class="period" id="periodPanel" hidden>
      <div class="quick">
        <button data-quick="all">전체</button><button data-quick="month">이번 달</button><button data-quick="m3">최근 3개월</button><button data-quick="year">올해</button>
      </div>
      <div class="range">
        <label for="pFrom">시작</label><select id="pFrom"></select>
        <span aria-hidden="true">–</span>
        <label for="pTo">끝</label><select id="pTo"></select>
      </div>
    </div>
    <div class="codes" id="catBar" role="group" aria-label="카테고리로 보기"></div>
    <div class="brands" id="brandBar" role="group" aria-label="브랜드로 보기" hidden></div>
    <ul class="list" id="itemList"></ul>
  </section>
</main>

<footer class="wrap site-foot">
  <p class="credit">ARCHIVED BY <a href="https://x.com/oob_oops" target="_blank" rel="noopener">우엉이<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3h7v7M13 3 4 12"/></svg></a></p>
  <p class="note">비공식 팬 아카이브 · 영상과 사진의 권리는 각 원작자에게 있습니다</p>
</footer>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-in">
    <div class="sheet-bar">
      <button class="back-btn" id="back" aria-label="날짜 상세로 돌아가기" style="visibility:hidden"><svg viewBox="0 0 16 16"><path d="M13 8H3M7 4 3 8l4 4"/></svg><span>LIST</span></button>
      <div class="nav">
        <button class="icon-btn" id="prevS" aria-label="이전 일정"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
        <div class="t"><span id="sheetTitle"></span><small id="sheetPos"></small></div>
        <button class="icon-btn" id="nextS" aria-label="다음 일정"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
      </div>
      <button class="icon-btn" id="close" aria-label="닫기"><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<script src="app.js?v=20261119-c1"></script>
</body>
</html>
