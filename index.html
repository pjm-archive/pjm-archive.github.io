<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>박정민 스케줄 아카이브</title>
<meta name="description" content="박정민 배우 온·오프라인 일정과 행사별 착용 아이템 아카이브">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: single mobile column, fixed top tab bar, hairline-ruled calendar grid, bottom-sheet popup with 1-depth navigation */
:root{
  --bg:#ffffff; --fg:#111111; --muted:#777a7d; --line:#d9dadb; --line-strong:#111111; --soft:#f4f4f5;
  --c-gv:#2f5d8a; --c-muin:#8a3b3b; --c-book:#3f6b45; --c-tv:#7a5a1f;
  --scrim:rgba(0,0,0,.35);
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0e0f; --fg:#f2f2f2; --muted:#8d9094; --line:#2c2d2f; --line-strong:#f2f2f2; --soft:#18191a;
  --c-gv:#7fa9d4; --c-muin:#d68a8a; --c-book:#8fbf95; --c-tv:#d3b06c; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0e0f; --fg:#f2f2f2; --muted:#8d9094; --line:#2c2d2f; --line-strong:#f2f2f2; --soft:#18191a;
  --c-gv:#7fa9d4; --c-muin:#d68a8a; --c-book:#8fbf95; --c-tv:#d3b06c; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line-strong);padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding-top:var(--hdr,96px)}
.brand{display:flex;justify-content:space-between;align-items:baseline;padding-block:14px 6px}
.brand h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.3}
.brand h1 a{color:inherit;text-decoration:none}
.site-foot .credit{display:flex;justify-content:space-between;align-items:center;gap:12px}
.guide-link{display:inline-flex;align-items:center;gap:3px;font-family:var(--sans);font-size:11px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);letter-spacing:0}
.guide-link svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.3}
.guide-link:hover{color:var(--fg)}
.guide{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.g-in{width:100%;max-width:440px;max-height:100%;background:var(--bg);border:1px solid var(--line-strong);display:flex;flex-direction:column;min-height:0}
.g-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;letter-spacing:.06em}
.g-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0;flex:1;background:#fff}
.g-track::-webkit-scrollbar{display:none}
.g-track img{flex:0 0 100%;width:100%;max-width:100%;height:auto;object-fit:contain;scroll-snap-align:center;display:block;max-height:calc(100dvh - 140px)}
.g-nav{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-top:1px solid var(--line)}
.g-dots{display:flex;gap:6px}
.g-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.g-dots i.on{background:var(--fg)}
.g-nav button:disabled{opacity:.2;cursor:default}
.brand span{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;gap:24px}
nav button{padding-block:8px 10px;font-size:14px;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--fg);font-weight:500;border-bottom-color:var(--fg)}

main{padding-block:20px 32px}
.sample{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em;border:1px solid var(--line);padding:3px 8px;display:inline-block;margin-bottom:16px}

/* calendar */
.extras{display:flex;gap:8px;align-items:stretch;margin-bottom:16px}
.upnext{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);padding:9px 10px;text-align:left}
.upnext{overflow:hidden}
.upnext .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.upnext .col.roll{animation:rollin .35s ease}
@keyframes rollin{from{opacity:0;transform:translateY(60%)}to{opacity:1;transform:none}}
.upnext .lb{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.upnext .tt{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext .tt .mq{display:inline-block}
.upnext .tt.flow{text-overflow:clip;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 8px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 8px,#000 calc(100% - 14px),transparent)}
.upnext .tt.flow .mq{display:inline-flex;animation:mq var(--dur,10s) linear 1.2s infinite}
@keyframes mq{to{transform:translateX(var(--dist))}}
@media (prefers-reduced-motion:reduce){.upnext .tt{white-space:normal}}
.upnext .dd{font-family:var(--mono);font-size:11.5px;font-weight:500;background:var(--fg);color:var(--bg);padding:2px 6px;white-space:nowrap}
.upnext.past .dd{background:transparent;color:var(--muted);border:1px solid var(--line)}
.randbtn{flex:none;border:1px solid var(--line);padding:9px 10px;font-size:12px;white-space:nowrap}
.randbtn:hover,.upnext:hover{border-color:var(--fg)}
.extras .upnext[hidden] + .randbtn{margin-left:auto}
.soon{margin:14px 0 0;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.soon b{font-family:var(--mono);font-size:12px;background:var(--fg);color:var(--bg);padding:2px 7px;font-weight:500}
.randbar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:8px 10px;background:var(--soft);font-size:12px;color:var(--muted)}
.randbar button{font-size:12px;color:var(--fg);border:1px solid var(--fg);padding:5px 10px;background:var(--bg)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head h2{margin:0;font-family:var(--mono);font-weight:400;font-size:20px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.cal-head .arrows{display:flex;gap:4px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line)}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.2}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow div{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;padding-block:6px;letter-spacing:.05em}
.dow div:first-child{color:var(--c-muin)}
.grid{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:76px;padding:5px 3px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.day.out{background:var(--soft)}
.day .n{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;width:20px;height:20px;line-height:20px}
.day.today .n{background:var(--fg);color:var(--bg);border-radius:50%}
.day.has{cursor:pointer}
.day.has:hover{background:var(--soft)}
.marks{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%}
.chip{display:inline-block;font-size:9.5px;line-height:1;padding:3px 4px;border:1px solid currentColor;border-radius:2px;white-space:nowrap;font-weight:500;letter-spacing:-.02em}
.chip.etc{color:var(--muted)} .chip.gv{color:var(--c-gv)} .chip.muin{color:var(--c-muin)} .chip.book{color:var(--c-book)} .chip.tv{color:var(--c-tv)} .chip.rel{color:var(--fg)}
.app{width:18px;height:18px;display:block}
.more{font-family:var(--mono);font-size:9px;color:var(--muted)}
.mk{position:relative;display:inline-flex}
.mk b{position:absolute;top:-5px;right:-8px;min-width:13px;height:13px;padding:0 3px;border-radius:7px;background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:8.5px;font-weight:500;line-height:13px;text-align:center;font-variant-numeric:tabular-nums}

.legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:16px;align-items:center;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* items list */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-strong)}
.list li{border-bottom:1px solid var(--line)}
.list button{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding-block:14px}
.thumb{width:64px;aspect-ratio:1;max-width:100%;border:1px solid var(--line);display:block}
.list .meta{min-width:0}
.list .date{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.list .ttl{font-size:14.5px;font-weight:500;margin-top:3px;text-wrap:balance}
.list .cnt{font-size:11.5px;color:var(--muted);margin-top:2px}
.list .go{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:1.2}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-top:1px solid var(--line-strong);max-height:86vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet-in{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1}
.sheet-bar{display:flex;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-bar .nav{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:2px}
.sheet-bar .t{min-width:0;display:flex;flex-direction:column;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet-bar .t small{font-size:9.5px;color:var(--muted);letter-spacing:.06em;min-height:12px}
.back-btn{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;width:64px;height:32px}
.back-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.2;flex:none}
#close{margin-left:32px}
.sheet-bar .icon-btn:disabled{opacity:.2;cursor:default}
.sheet-body.in-r{animation:inR .22s ease}
.sheet-body.in-l{animation:inL .22s ease}
@keyframes inR{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sheet-body.in-r,.sheet-body.in-l{animation:none}}
.sheet-bar .icon-btn{border:0;width:32px;height:32px}
.sheet-bar .icon-btn svg{width:16px;height:16px}
.sheet-body{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}

.ev{padding-block:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.ev:last-child{border-bottom:0}
.ev .type{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.ev h3{margin:0;font-size:16px;font-weight:500;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.ev h3 button{display:inline;text-align:left;font-weight:inherit;line-height:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.ev h3 button svg{display:inline-block;width:12px;height:12px;margin-left:3px;vertical-align:-1px;stroke:currentColor;fill:none;stroke-width:1.3}
.ev dl{margin:0;display:grid;grid-template-columns:36px 1fr;gap:4px 8px;font-size:13px}
.ev dt{color:var(--muted);font-size:11px;padding-top:2px}
.ev dd{margin:0;min-width:0}

.item-head{padding-block:16px 4px}
.item-head .type{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.item-head h3{margin:6px 0 0;font-size:17px;font-weight:500;word-break:keep-all;overflow-wrap:anywhere}
.srcs{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.src{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:10px 12px;color:var(--fg);text-decoration:none;font-size:13px}
.src:hover{border-color:var(--fg)}
.src .who{flex:1;min-width:0;display:flex;flex-direction:column}
.src .who b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .who small{font-size:11px;color:var(--muted)}
.src svg.ext{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.3;flex:none}
.item{padding-block:18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.item:last-child{border-bottom:0}
.photo{width:100%;max-width:100%;aspect-ratio:4/5;border:1px solid var(--line);display:block}
.item .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cat{font-family:var(--mono);font-size:10px;letter-spacing:.08em;border:1px solid var(--fg);padding:2px 7px}
.idx{font-family:var(--mono);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .name{font-size:14.5px;font-weight:500;margin:0}
.item .brandname{font-size:12px;color:var(--muted);margin:0}
.buy{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line-strong);padding:10px 12px;font-size:13px;color:var(--fg);text-decoration:none}
.buy svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.3}
.buy:hover{background:var(--fg);color:var(--bg)}
.status{font-size:12px;color:var(--muted);margin-bottom:12px}
.status:empty{display:none}
.embed{margin-top:14px;min-height:40px}
.embed iframe{width:100%;max-width:100%;aspect-ratio:16/9;border:0;display:block}
.tools{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.tool{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:7px 10px;font-size:12.5px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tool svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.2}
.tool .caret{width:11px;height:11px;transition:transform .15s}
.tool[aria-expanded="true"] .caret{transform:rotate(180deg)}
.tool.on{border-color:var(--fg)}
.sortwrap{position:relative;padding:0}
.sortwrap select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-family:var(--sans);font-size:12.5px;color:var(--fg);padding:7px 28px 7px 10px;border-radius:0;cursor:pointer}
.sortwrap .caret{position:absolute;right:9px;top:50%;margin-top:-5.5px;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.list li.pcount{font-size:11px;color:var(--muted);font-family:var(--mono);padding-block:4px 10px;border-bottom:0}
.period{border:1px solid var(--line);padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.period .quick{display:flex;flex-wrap:wrap;gap:6px}
.period .quick button{border:1px solid var(--line);padding:5px 10px;font-size:12px;color:var(--muted)}
.period .quick button[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.period .range{display:grid;grid-template-columns:auto 1fr auto auto 1fr;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.period select{min-width:0;width:100%;font:inherit;font-family:var(--mono);font-size:12.5px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:0;padding:6px 6px}
.list .mhead{position:sticky;top:var(--hdr,96px);z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:baseline;padding-block:14px 6px;border-bottom:1px solid var(--line-strong)}
.list .mhead span{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.list .mhead small{font-size:11px;color:var(--muted)}
.list{border-top:0}
.reset{margin-left:6px;text-decoration:underline;text-underline-offset:3px;color:var(--fg);font-size:13px}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;margin-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.bf.zero{opacity:.35;cursor:default}
.tools{flex-wrap:wrap}
.tl{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.bwrap{display:inline-flex}
.bwrap #brandBtn{max-width:170px}
.bwrap #brandLabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--sans)}
.tool.on{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.tool.clr{border-left:0;padding:7px 8px;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tool.clr svg{width:11px;height:11px}
.bpanel input{font:inherit;font-size:13px;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px 10px;border-radius:0}
.bpanel input:focus{outline:1px solid var(--fg);outline-offset:-1px}
.plabel{margin:0 0 6px;font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.blist{list-style:none;margin:0;padding:0;max-height:220px;overflow-y:auto;border-top:1px solid var(--line)}
.blist li{border-bottom:1px solid var(--line)}
.blist button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:9px 2px;font-size:13px;text-align:left}
.blist button small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.blist button[aria-pressed="true"]{font-weight:600}
.blist button[aria-pressed="true"]::after{content:"✓";margin-left:8px}
.blist .none{padding:12px 2px;font-size:12px;color:var(--muted);border:0}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 10px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.listhead .sortwrap{border:0}
.listhead .sortwrap select{font-size:12px;padding:4px 22px 4px 4px;color:var(--fg)}
.listhead .sortwrap .caret{right:2px}
.listhead .reset{font-family:var(--sans);font-size:11px;margin-left:8px}
.list .reset{display:inline;padding:0;width:auto}
.brands{display:flex;gap:6px;overflow-x:auto;padding-bottom:14px;margin-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.brands::-webkit-scrollbar{display:none}
.bf{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:6px 11px;font-size:12.5px;white-space:nowrap;color:var(--muted)}
.bf span{font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums}
.bf[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.site-foot{border-top:1px solid var(--line);padding-block:20px 32px;display:flex;flex-direction:column;gap:6px}
.site-foot p{margin:0}
.site-foot .credit{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted)}
.site-foot .credit a{color:var(--fg);text-decoration:none;font-family:var(--sans);font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:3px;margin-left:4px;border-bottom:1px solid var(--line)}
.site-foot .credit a:hover{border-bottom-color:var(--fg)}
.site-foot .credit svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:1.3}
.site-foot .note{font-size:11px;color:var(--muted);line-height:1.5}
.ev .hints{display:flex;gap:6px;margin-top:2px}
.ev .hints span{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:2px 7px}
.ev .hints span.on{color:var(--fg);border-color:var(--fg)}
.evmeta{margin:10px 0 0;display:grid;grid-template-columns:36px 1fr;gap:4px 8px;font-size:13px}
.evmeta dt{color:var(--muted);font-size:11px;padding-top:2px}.evmeta dd{margin:0;min-width:0}
.sec{margin:26px 0 8px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em;display:flex;gap:6px;align-items:baseline;border-bottom:1px solid var(--line-strong);padding-bottom:8px}
.sec span{font-family:var(--mono);color:var(--fg)}
.prows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:auto 1fr 14px;gap:12px;align-items:center;width:100%;text-align:left;padding-block:10px;border-bottom:1px solid var(--line)}
.prow > svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:1.2}
.prow .pt{min-width:0;display:flex;flex-direction:column;gap:1px}
.prow .pc{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.prow .pn{font-size:13.5px;font-weight:500;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.prow .pb{font-size:11.5px;color:var(--muted)}
.evicon{width:44px;display:grid;place-items:center}
.pthumb{position:relative;display:block;aspect-ratio:1;width:100%;max-width:100%;background:#fff;border:1px solid var(--line);overflow:hidden}
.pthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6%}
.pthumb .fb{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;opacity:.55}
.pthumb img + .fb{display:none}
.pthumb.sm{width:56px}
.pthumb.lg{width:100%}
.pthumb.lg .fb{font-size:56px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;padding-block:6px 22px;border-bottom:0 !important}
.list li.pgrid{border-bottom:0}
.list .pcard{display:flex;padding:0;align-items:stretch;flex-direction:column;gap:3px;text-align:left;min-width:0}
.pcard .pthumb{margin-bottom:6px}
.pcard .pb{font-size:10.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pn{font-size:13px;font-weight:500;line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.pcard .pd{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.pcard .pd b{font-weight:500;color:var(--fg);white-space:nowrap}
.pcard:hover .pthumb{border-color:var(--fg)}
.pdetail{padding-top:10px;display:flex;flex-direction:column}
.pdetail .pb{margin:16px 0 0;font-size:11.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
.pdetail h3.pn{margin:4px 0 14px;font-size:18px;font-weight:500;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.evlink .pn{font-size:16px}
.hint-s{margin:6px 0 0;font-size:11px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding-block:20px}
</style>

<body>
<header>
  <div class="wrap">
    <div class="brand"><h1><a href="./" id="homeLink">박정민 스케줄 아카이브</a></h1><span>Fan archive</span></div>
    <nav role="tablist">

      <button role="tab" id="tab-items" aria-selected="false" data-view="items">아이템정보</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="status" id="status">불러오는 중…</div>

  <section id="view-cal">
    <div class="extras">
      <button class="upnext" id="upnext" hidden></button>

    </div>
    <div class="cal-head">
      <h2 id="monthLabel"></h2>
      <div class="arrows">
        <button class="icon-btn" id="prev" aria-label="이전 달"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
        <button class="icon-btn" id="next" aria-label="다음 달"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
      </div>
    </div>
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid" id="grid"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section id="view-items" hidden>
    <div class="cats" id="catBar" role="group" aria-label="카테고리로 보기"></div>
    <div class="tools">
      <div class="tl"><button class="tool" id="periodBtn" aria-expanded="false" aria-controls="periodPanel"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="10"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/></svg><span id="periodLabel">전체 기간</span><svg class="caret" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
      <span class="bwrap"><button class="tool" id="brandBtn" aria-expanded="false" aria-controls="brandPanel"><span id="brandLabel">브랜드</span><svg class="caret" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button><button class="tool clr" id="brandClear" aria-label="브랜드 필터 해제" hidden><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span></div>
    </div>
    <div class="period" id="periodPanel" hidden>
      <div class="quick">
        <button data-quick="all">전체</button><button data-quick="month">이번 달</button><button data-quick="m3">최근 3개월</button><button data-quick="year">올해</button>
      </div>
      <div class="range">
        <label for="pFrom">시작</label><select id="pFrom"></select>
        <span aria-hidden="true">–</span>
        <label for="pTo">끝</label><select id="pTo"></select>
      </div>
    </div>
    <div class="period bpanel" id="brandPanel" hidden>
      <input type="search" id="bSearch" placeholder="브랜드 검색 (예: 칼하트, pilot)" aria-label="브랜드 검색" autocomplete="off">
      <div id="bFreqWrap"><p class="plabel">자주 입은 브랜드</p><div class="chips" id="bFreq"></div></div>
      <div><p class="plabel">전체 브랜드</p><ul class="blist" id="bAll"></ul></div>
    </div>
    <div class="listhead"><span id="pCount"></span><label class="tool sortwrap"><span class="sr">정렬</span><select id="sortSel"><option value="desc">최근 착용순</option><option value="asc">오래된순</option><option value="most">많이 입은 순</option></select><svg class="caret" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></label></div>
    <ul class="list" id="itemList"></ul>
  </section>
</main>

<footer class="wrap site-foot">
  <p class="credit"><span>Archived by <a href="https://x.com/oob_oops" target="_blank" rel="noopener">우엉이<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3h7v7M13 3 4 12"/></svg></a></span><button class="guide-link" id="guideBtn"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M6.3 6.3a1.8 1.8 0 1 1 2.4 1.7c-.5.2-.7.6-.7 1.1v.4M8 11.6v.1"/></svg>이용 안내</button></p>
  <p class="note">비공식 팬 아카이브 · 영상과 사진의 권리는 각 원작자에게 있습니다</p>
</footer>

<div class="guide" id="guide" role="dialog" aria-modal="true" aria-label="사이트 이용 안내" hidden>

    <div class="g-track" id="gTrack">
      <img src="images/guide/guide-1.jpg?v=3" alt="1. 박정민 스케줄 아카이브 소개. 2026년 10월부터 온·오프라인 일정과 그날 입은 옷을 기록해요. 일정이 있는 날을 누르면 그날 일정이 열려요." loading="lazy">
      <img src="images/guide/guide-2.jpg?v=3" alt="2. 밑줄 친 일정을 누르면 영상과 그날 입은 아이템이 함께 나오는 상세 카드가 열려요." loading="lazy">
      <img src="images/guide/guide-3.jpg?v=3" alt="3. 아이템정보 탭에서는 상품 사진부터 보고, 누르면 상품 정보와 구매 링크, 착용 일정이 나와요. 구매 링크는 판매 종료 등으로 안 열릴 수 있어요." loading="lazy">
      <img src="images/guide/guide-4.jpg?v=3" alt="4. 카드 상단의 화살표나 좌우 스와이프로 이전·다음 일정과 아이템으로 넘길 수 있어요." loading="lazy">
    </div>
    <div class="g-nav"><button class="icon-btn" id="gPrev" aria-label="이전 안내"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button><span class="g-dots" id="gDots"><i class="on"></i><i></i><i></i><i></i></span><button class="icon-btn" id="gNext" aria-label="다음 안내"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button></div>
  </div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-in">
    <div class="sheet-bar">
      <button class="back-btn" id="back" aria-label="날짜 상세로 돌아가기" style="visibility:hidden"><svg viewBox="0 0 16 16"><path d="M13 8H3M7 4 3 8l4 4"/></svg><span>목록</span></button>

        <button class="icon-btn" id="prevS" aria-label="이전 일정"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>

  </div>
</div>
